# This file was generated by Claude.
name: Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            gcc \
            g++ \
            clang \
            qt6-base-dev \
            qt6-declarative-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: ninja -C build

      - name: Test
        working-directory: build
        run: ninja test

  build-macos:
    name: Build & Test (macOS Apple Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja cmake qtdeclarative

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: ninja -C build

      - name: Test
        working-directory: build
        run: ninja test
